    const fromLogo = p => { const s = S.targets[0].pts[(Math.random() * S.targets[0].pts.length) | 0]; p.x = s.x; p.y = s.y; p.vx = (Math.random() - .5) * 6; p.vy = 4 + Math.random() * 6; };
